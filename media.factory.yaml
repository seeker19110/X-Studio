# Hồ sơ vận hành xưởng. Giữ cấu hình TTS/ảnh thật của bạn khi ghép các block vào media.yaml.
# Fake mặc định để một bản sao cấu hình không tự phát sinh chi phí API.
output_dir: output
upload_dir: output/uploads
tts:
  provider: fake
image:
  provider: fake
video:
  provider: ffmpeg
  resolution: 1920x1080
  fps: 30
  motion: auto
  fit: cover
  tail_pad_s: 0.35
  loudness_lufs: -14
  burn_captions: true
  caption_max_chars: 42
render:
  mode: bounded
  threads: 2
  max_retries: 3
  segment_cache_max_bytes: 0  # 0: không tự dọn; đặt ngân sách để dọn segment cũ không dùng
  min_free_disk_bytes: 268435456  # giữ khoảng trống 256 MiB khi kiểm tra giữa các bước
  timeout_s: 86400  # trần mỗi lệnh; giảm khi chỉ làm video ngắn
production:
  automation: production  # manual | production | publish; cũng đổi được trong UI
  max_minutes: 720
  chapter_minutes: 8
  duration_tolerance: 0.20
  allow_qc_warnings: false
  media_budget_usd: 0  # trần chi phí media MỖI video (USD ước tính theo tts/image/scene_video.price_*); 0 = không trần
  style: "Cinematic documentary, natural light, coherent color palette, uncluttered composition."
  music_volume: 0.12
  library: library.yaml
  scenes: {}
  music: {}
  graphics: {}
platform:
  provider: fake  # chọn youtube sau khi kết nối tài khoản của bạn
