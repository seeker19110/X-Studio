# Eval cho fact-checker. Chạy: python -m studio.evals fact-checker
cases:
  - name: claim-khong-nguon-phai-block
    topic_out: review-results
    input:
      topic: scripts
      key: CH1-V1
      actor: script-writer
      payload:
        video_id: CH1-V1
        working_title: t
        hook: "Bạn mất 6 giờ cho một video?"
        sections: [{heading: "Vấn đề", narration: "90% kênh mới chết trong năm đầu.", claim_ids: [C1]}]
        claims: [{claim_id: C1, text: "90% kênh mới chết trong năm đầu", source: null, needs_verification: true}]
    expect:
      equals: {video_id: CH1-V1, source: fact, verdict: block}
      min_len: {findings: 1}
      one_of: {findings.0.level: [block]}

  # Nguồn phải là trang thật, ổn định: fact-checker MỞ nguồn bằng tool web (ADR-0007), URL giữ chỗ sẽ bị block đúng luật.
  - name: claim-co-nguon-khop-phai-pass
    topic_out: review-results
    input:
      topic: scripts
      key: CH1-V2
      actor: script-writer
      payload:
        video_id: CH1-V2
        working_title: t
        hook: "Bạn còn dùng bản Python cũ?"
        sections: [{heading: "Bối cảnh", narration: "Python 3.11 được phát hành chính thức ngày 24 tháng 10 năm 2022.", claim_ids: [C1]}]
        claims: [{claim_id: C1, text: "Python 3.11 phát hành chính thức ngày 24/10/2022", source: "https://www.python.org/downloads/release/python-3110/ (mục Release Date)", needs_verification: true}]
    expect:
      equals: {video_id: CH1-V2, source: fact, verdict: pass}
