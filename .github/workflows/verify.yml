name: Verify factory
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: uv sync --all-packages --locked
      - run: make lint-all
      - run: make cov-all
      - run: make eval-replay
      - name: Install browser for console smoke
        run: uv run playwright install --with-deps chromium
      - name: Exercise operations UI with isolated demo data
        run: uv run python scripts/operations-smoke.py
  windows-operations:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: choco install ffmpeg --no-progress -y
      - run: uv sync --all-packages --locked
      - name: Check Unicode, SQLite recovery and portrait rendering
        run: uv run pytest -q tests/test_storage.py tests/test_backup.py tests/test_shorts.py tests/test_speech_timing.py -k "not symlink"
      - name: Render a short local fixture with Vietnamese subtitles
        run: uv run studio doctor --demo --json --smoke "${{ runner.temp }}/kiểm-tra-video.mp4"
