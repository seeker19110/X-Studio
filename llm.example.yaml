# Cấu hình model TEXT cho runner/eval. Sao chép thành `llm.yaml` (bị gitignore) hoặc dùng biến môi trường STUDIO_*.
# Phòng ban trung lập provider: đổi model/provider ở đây, không đổi code hay prompt.

# anthropic | openai (mọi server OpenAI-compatible: OpenAI, OpenRouter, Gemini OpenAI-compat, Ollama, Groq, vLLM...)
# | claude-code (CLI `claude -p` đã đăng nhập trên máy, không cần key) | fake
provider: openai

# model theo tier trong front matter agent
# strong = sáng tác/review cần suy luận; standard = việc có cấu trúc; light = việc cơ học, ngắn (thiếu light → standard)
models:
  strong: gpt-5            # ví dụ; hoặc claude-opus-5, gemini-2.5-pro, qwen3:32b (Ollama)...
  standard: gpt-5-mini
  light: gpt-5-nano

# chỉ provider openai: base URL của server. Ollama: http://localhost:11434/v1 ; OpenRouter: https://openrouter.ai/api/v1
base_url: https://api.openai.com/v1
# api key đặt qua biến môi trường STUDIO_LLM_API_KEY (không ghi vào file)

# Tool web chỉ đọc (ADR-0007) cho agent có `tools: [web]` (trend-researcher, fact-checker) — cấu hình bằng biến môi trường:
#   STUDIO_SEARCH_URL=http://localhost:8080/search   endpoint SearXNG (JSON `?q=...&format=json`) hoặc endpoint tương thích
#                                                    `{results: [{title, url, content}]}`; URL có `{q}` thì thay vào đó.
#   Không đặt → web_search báo "chưa cấu hình search", web_fetch vẫn chạy (URL đã biết).
#   Provider claude-code không cần: CLI tự dùng WebSearch/WebFetch.

max_tokens: 16000

# chỉ provider anthropic: mức nỗ lực theo tier (low | medium | high | xhigh | max)
effort:
  strong: high
  standard: medium
  light: low

# tham số provider-specific truyền thẳng vào request (vd. temperature)
extra: {}

# --- ADR-0006: nhiều gói tài khoản subscription thay vì API trả theo token ---
# Khai `backends:` thì provider/models/base_url ở trên KHÔNG dùng nữa. Mỗi backend = một gói đang đăng nhập trên máy,
# có model riêng theo tier; thiếu tier nào thì backend đó dùng standard → strong. Thứ tự khai báo = thứ tự ưu tiên;
# `routing.prefer` ghi đè theo tier để tối ưu chi phí. Hết quota → backend nghỉ `cooldown_s` (hoặc đúng Retry-After),
# lượt đó đi backend kế; lỗi mạng/5xx → nghỉ `transient_cooldown_s`. STUDIO_LLM_BACKENDS=a,b lọc/sắp lại khi chạy.
