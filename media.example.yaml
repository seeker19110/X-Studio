# Cấu hình lớp MEDIA (ADR-0003): giọng đọc (TTS), ảnh cảnh, ghép video. Sao chép thành `media.yaml` (bị gitignore)
# hoặc dùng biến môi trường STUDIO_MEDIA_*. Mỗi kênh chọn provider độc lập; `fake` sinh file giữ chỗ để chạy offline.
#
# Khóa API mỗi kênh: `api_key_env: TEN_BIEN` (khuyên dùng) hoặc `api_key` (file dễ lộ, chỉ khi thử nhanh). Không khai thì dùng
# biến quen thuộc của provider (GEMINI_API_KEY, ELEVENLABS_API_KEY, AZURE_SPEECH_KEY, GOOGLE_API_KEY, STABILITY_API_KEY,
# REPLICATE_API_TOKEN), cuối cùng là STUDIO_MEDIA_API_KEY (dùng chung khi tts/ảnh cùng một nhà cung cấp).
# Giọng: `voice_id`, `pace` (slow|medium|fast), `language` trong scene manifest là ý định của production-manager; bảng `voices`
# dịch voice_id sang giọng của provider đang dùng; `pace` tự map sang tham số tốc độ của từng provider.

tts:
  provider: openai          # openai | gemini | elevenlabs | azure | google | edge | command | fake
  # --- openai: POST {base_url}/audio/speech — OpenAI hoặc mọi server tương thích
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini-tts
  voice: alloy              # dùng khi manifest không có voice_id (hoặc id không có trong `voices`)
  # instructions: "Giọng kể chuyện tiếng Việt tự nhiên, ấm, không đọc như máy"   # model hỗ trợ (gpt-4o-mini-tts)
  # voices: {alloy: coral, nova: sage}        # dịch voice_id của manifest → giọng provider; id không có trong bảng → `voice`
  #
  # --- gemini: Gemini TTS (nhiều giọng, có tiếng Việt), trả PCM → WAV nên thời lượng đo chính xác. Key: GEMINI_API_KEY
  # provider: gemini
  # model: gemini-2.5-flash-preview-tts       # hoặc gemini-2.5-pro-preview-tts
  # voice: Kore                               # Kore, Puck, Charon, Zephyr, Aoede, Leda…
  # style: "Giọng kể chuyện ấm, tự nhiên"     # câu dẫn phong cách (Gemini điều khiển ngữ điệu bằng lời; pace slow/fast tự thêm)
  #
  # --- elevenlabs: id giọng riêng của ElevenLabs — bắt buộc `voice` hoặc bảng `voices`. Key: ELEVENLABS_API_KEY
  # provider: elevenlabs
  # model: eleven_multilingual_v2             # hoặc eleven_flash_v2_5 (rẻ, nhanh)
  # voice: <voice_id>
  # voice_settings: {stability: 0.5, similarity_boost: 0.75}
  # output_format: mp3_44100_128
  #
  # --- azure: Azure AI Speech, giọng tiếng Việt vi-VN-HoaiMyNeural (nữ) / vi-VN-NamMinhNeural (nam). Key: AZURE_SPEECH_KEY
  # provider: azure
  # region: southeastasia
  # voice: vi-VN-HoaiMyNeural
  # voices: {alloy: vi-VN-HoaiMyNeural, onyx: vi-VN-NamMinhNeural}
  # output_format: audio-24khz-96kbitrate-mono-mp3
  #
  # --- google: Cloud Text-to-Speech (vi-VN-Neural2-A/D, vi-VN-Wavenet-A…D). Key: GOOGLE_API_KEY, bật API trong Cloud Console
  # provider: google
  # voice: vi-VN-Neural2-A
  # language: vi
  #
  # --- edge: dịch vụ Edge TTS, nhận word timing cho phụ đề (cần mạng; không cần API key).
  # provider: edge                # edge-tts >= 7.3.1
  # voice: vi-VN-HoaiMyNeural
  # voices: {alloy: vi-VN-HoaiMyNeural, onyx: vi-VN-NamMinhNeural}
  # rate: "+0%"                 # nếu khai rõ sẽ ưu tiên hơn pace của manifest
  # Timing được buộc vào checksum audio; provider khác thiếu timing dùng nhãn estimated.
  #
  # --- command: chương trình đã cấu hình (Piper, Kokoro, CLI…). Không qua shell.
  #     Chi phí và việc gửi dữ liệu phụ thuộc chương trình; không tự coi là miễn phí/offline.
  #     Chỗ giữ: {text} {out} {voice} {lang} {pace}; văn bản cũng được đưa vào stdin. File {out} phải có sau khi lệnh xong.
  # provider: command
  # command: "piper -m vi_VN-vais1000-medium.onnx -f {out}"
  # command: "edge-tts --voice {voice} --text {text} --write-media {out}"
  # voice: vi-VN-HoaiMyNeural
  # suffix: .wav                              # edge-tts ghi mp3 → đặt .mp3
  # timeout_s: 300
  # timing_sidecar: true                     # require {out with suffix .timing.json}: sha256, source, words(text/start/duration)
  # license: unknown                         # dataset CC BY alone does not establish model/output clearance
  # source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/vi/vi_VN/vais1000/medium/MODEL_CARD
  # attribution: "Piper/VAIS1000; dataset CC BY 4.0; output release not cleared; local preview"
  # Local Piper example (piper-tts[alignment]==1.8.0); inspect model/data lineage before publication:
  # command: "path/to/piper-python scripts/piper-speech.py --model path/to/vi_VN-vais1000-medium.onnx --out {out}"
  # Commercial Vietnamese preset: pinned VieNeu v3 Turbo + offline ASR word verification.
  # Runtime: vieneu==3.8.3, faster-whisper; artifact manifest includes model/codec/preset hashes.
  # command: "path/to/vieneu-python scripts/vieneu-speech.py --artifacts runtime-artifacts.json --asr-cache path/to/asr-models --voice {voice} --out {out}"
  # voice: "Ngọc Huyền"
  # license: licensed
  # source_url: https://huggingface.co/pnnbao-ump/VieNeu-TTS-v3-Turbo
  # Keep attribution and Apache notices; use bundled presets covered by the publisher's explicit commercial grant.
  # model: VieNeu-TTS-v3-Turbo/Ngoc-Huyen

image:
  provider: openai          # openai | gemini | stability | replicate | command | fake
  # --- openai: POST {base_url}/images/generations. KÍCH THƯỚC THEO MODEL: gpt-image-1 nhận 1024x1024 | 1536x1024 | 1024x1536
  #     (sai kích thước → HTTP 400); dall-e-3 nhận 1792x1024 | 1024x1792. Bỏ trống `size` là an toàn nhất: code tự chọn
  #     kích thước hợp lệ của model theo `aspect` của manifest (16:9 cho video dài, 9:16 cho Shorts), và sửa lại nếu khai sai.
  base_url: https://api.openai.com/v1
  model: gpt-image-1
  # size: 1536x1024
  #
  # --- gemini: `gemini-2.5-flash-image` (generateContent) hoặc `imagen-4.0-generate-001` (predict) theo tên model;
  #     `size` được đổi sang tỷ lệ gần nhất (16:9 / 9:16 / 1:1…). Key: GEMINI_API_KEY
  # provider: gemini
  # model: gemini-2.5-flash-image
  #
  # --- stability: Stable Image `core` | `sd3` | `ultra` (đoạn đường dẫn); tham số thêm qua `extra`. Key: STABILITY_API_KEY
  # provider: stability
  # model: core
  # negative_prompt: "text, watermark, logo, real person"
  # extra: {style_preset: photographic}       # sd3: {model: sd3.5-large}
  #
  # --- replicate: Flux, SDXL… dạng `owner/name`; tham số riêng của model qua `input`. Key: REPLICATE_API_TOKEN
  # provider: replicate
  # model: black-forest-labs/flux-schnell
  # input: {num_inference_steps: 4}
  # poll_s: 2
  # poll_max: 60
  #
  # --- command: chương trình tạo PNG thật; prompt đi qua stdin, lệnh chạy không qua shell.
  #     {size} = WIDTHxHEIGHT, {out} = đường dẫn PNG, {prompt} = prompt (ưu tiên stdin để tránh lộ trên argv).
  #     CLI vector dùng backend đăng nhập trong llm.yaml; model thiết kế SVG, code kiểm tra rồi rasterize bằng FFmpeg.
  # provider: command
  # model: cli-vector
  # command: ".venv/bin/python -m studio.cli_visual --size {size} --out {out}"
  # timeout_s: 900

video:
  provider: ffmpeg          # ffmpeg (ghép ảnh + audio thành MP4, cần ffmpeg trên PATH; có ffprobe thì thời lượng audio đo thật) | fake
  fps: 30
  resolution: 1920x1080     # khung của video dài; manifest `aspect: 9:16` (Shorts) tự hoán đổi thành 1080x1920
  layout: editorial        # bố cục chữ/hình theo tỷ lệ; full_bleed giữ kiểu hình lấp khung trước đây
  burn_captions: true
  caption_max_chars: 38
  caption_max_chars_portrait: 26
  trim_voice_tail: true    # chỉ khi có word timing hợp lệ; giữ 0,28 s sau từ cuối, không cắt nội dung lời đọc
  fit: cover                # cover: ảnh lấp đầy khung, cắt mép (mặc định) | contain: giữ trọn ảnh, chấp nhận viền đen
  tail_pad_s: 0.35          # im lặng đệm cuối mỗi cảnh; cảnh dài đúng bằng giọng đọc, không bị cắt theo thời lượng ước lượng
  motion: none              # editorial giữ chữ cố định; full_bleed có thể chọn auto/zoom/pan
                            # | none | zoom_in | zoom_out | pan_left | pan_right (ép cùng một kiểu cho cả video)
  transition_s: 0.3         # chuyển cảnh mờ dần; tự kẹp ≤ tail_pad_s để giọng đọc hai cảnh không chồng nhau; 0 = cắt thẳng
  loudness_lufs: -14        # chuẩn hoá âm lượng về mức nền tảng phát lại (đỉnh ≤ -1 dBTP); `null` = giữ nguyên tiếng gốc
  # font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf   # font phủ chữ thumbnail (mặc định: tìm font đậm có sẵn trên máy;
  #                          không có font thì thumbnail vẫn ra 1280x720 nhưng KHÔNG có chữ, và audit `thumbnail.finish` nói rõ)
  # binary: ffmpeg

# Lệnh con của lượt render (ffmpeg, TTS cục bộ `provider: command`) chạy qua lớp `sandbox` — xem
# `src/studio/sandbox.py` (bản tạm, sẽ chuyển vào lõi chung `xagents-core`).
render:
  timeout_s: 600            # trần MỘT lệnh ffmpeg; hết giờ là lỗi render có thông báo, không phải cả phòng treo im lặng
  # Với mode: bounded, ngân sách chỉ tính MKV checkpoint; không xóa cache TTS/ảnh hoặc tài nguyên người dùng.
  # segment_cache_max_bytes: 21474836480  # tùy chọn 20 GiB mỗi video; mặc định 0 không tự dọn
  # min_free_disk_bytes: 268435456       # mặc định 256 MiB; kiểm tra dung lượng giữa các bước, không phải quota OS
  # sandbox:
  #   mode: subprocess      # subprocess (mặc định) | container | auto. KHÔNG mặc định `auto` như software-company:
  #                         # ffmpeg đọc/ghi đường dẫn tuyệt đối trải trên nhiều thư mục (output, font, thư mục tạm) mà
  #                         # container chỉ thấy cwd được mount — bật container là việc phải cố ý, kèm tự lo mount.
  #   runtime: docker       # docker | podman; khai `mode: container` mà thiếu binary → lỗi ngay, không âm thầm hạ cấp
  #   image: python:3.12-slim   # image phải có sẵn ffmpeg/ffprobe nếu dùng cho render
  # Biến môi trường tương đương (thắng file): STUDIO_SANDBOX, STUDIO_SANDBOX_RUNTIME, STUDIO_SANDBOX_IMAGE.
  # Dù backend nào, env của lệnh con đã lọc mọi biến trông như khoá (SECRET_ENV): lệnh TTS của người khác
  # không thấy ELEVENLABS_API_KEY / STUDIO_LLM_API_KEY. Tên sandbox đã dùng nằm trong audit `render.*`.

# Adapter nền tảng phân phối (ADR-0008): CODE gọi sau gate publish/replies và trong `python -m studio.youtube sync-*`.
# fake (mặc định, offline) | youtube (Data API v3 + Analytics API v2; đăng nhập trước bằng
# `python -m studio.youtube login --client-secrets client_secret.json`). Biến môi trường tương đương: STUDIO_PLATFORM=youtube
platform:
  provider: fake
  # tokens: ~/.x-agents/auth/youtube_tokens.json   # hoặc STUDIO_YOUTUBE_TOKENS; không bao giờ commit

# thư mục đặt asset sinh ra (bị gitignore)
output_dir: output
# api key dùng chung cho tts/image khi cùng nhà cung cấp: STUDIO_MEDIA_API_KEY; khác nhà cung cấp → `api_key_env` từng kênh ở trên

# Sinh clip cho phim/hoạt hình, độc lập video.provider (bộ ghép FFmpeg).
# Cấu hình ComfyUI workflow/bindings và command: media.film.example.yaml.
scene_video:
  provider: none
  duration_s: 5
  fps: 24
  resolution: 832x480
  license: unknown

# Vận hành: giá do người vận hành nhập, không tự lấy từ hóa đơn/provider.
# Hạn mức là ước tính media theo dự án; không bao gồm chi phí text model/CLI subscription.
production:
  automation: manual
  # pricing:
  #   tts_per_1000_chars: 0.0
  #   image_per_request: 0.0
  #   video_per_second: 0.0
  # media_budget_usd: 5.0  # thiếu giá của loại cần sinh sẽ dừng trước khi gọi provider
  # review_required: true  # chặn xuất bản khi chưa có adapter review hình/tiếng
  # review_command: [python, local_reviewer.py]  # nhận JSON qua stdin, trả verdict pass|warn|block + findings
  # review_timeout_s: 60
