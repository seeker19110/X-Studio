[project]
name = "gateway"
version = "0.1.0"
description = "Proxy OpenAI-compatible xoay vòng tài khoản Google Antigravity (OAuth) cho các công ty AI trong X-Agents"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/gateway"]
omit = ["src/gateway/__main__.py"]   # chỉ gọi main(); chạy bằng process thật, không đo được trong pytest

[tool.coverage.report]
# Ngưỡng đặt ở mức đang đạt được: nó chặn tụt lùi, không phải mục tiêu để phấn đấu tới.
fail_under = 73
show_missing = true
skip_covered = true
