[project]
name = "gateway"
version = "0.1.0"
description = "Proxy OpenAI-compatible xoay vòng tài khoản Google Antigravity (OAuth) cho các công ty AI trong X-Agents"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/gateway"]
omit = ["src/gateway/__main__.py"]   # chỉ gọi main(); chạy bằng process thật, không đo được trong pytest

[tool.coverage.report]
# Cả bốn package phủ 100% dòng: ngưỡng bằng đúng mức đạt được, nên mất một dòng phủ là CI đỏ.
# Nhánh phụ thuộc nền tảng (os.name == "nt", AF_INET6) được test bằng cách thay socket/ctypes, không bằng môi trường.
fail_under = 100
show_missing = true
skip_covered = true
